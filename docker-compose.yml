# docker-compose.yml — Desarrollo local y pruebas
# USO: docker compose up --build
#
# Para producción usa la DigitalOcean App Spec (digitalocean.yaml)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fauna-monitoring-api:local
    container_name: fauna_api
    ports:
      - "8000:8000"
    environment:
      # La base de datos está en Aiven (remota), solo se necesita la URL
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8001}
      # Cola (HU-08): Redis del compose. Lleva solo avisos; la BD es la fuente de verdad.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      # Montar uploads fuera del contenedor para persistir videos e imágenes en local
      - ./uploads:/code/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Override del CMD para desarrollo: hot-reload
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  redis:
    image: redis:7.4-alpine
    container_name: fauna_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
