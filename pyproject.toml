# Quality gate del back (ESTANDARES §10, DoD §3). Ejecutar: ruff check . · ruff format --check . · mypy
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "app/integrations/ia_contract",  # copia sin editar de la IA (SOURCE.md)
    "migrations",
    "tareas-job",
    "scratch",
    "Analisis_Backend_3.0_WWF_2026-11-15",
    # DEUDA (ratchet): código legado que no cumple el estándar. Cada HU que reescribe un
    # archivo lo saca de esta lista; nunca se agregan archivos nuevos aquí.
    "app/db/session.py",
    "check_db.py",
    "tests/test_bug01_secrets_purge.py",
    "tests/test_bug01_settings_security.py",
    "tests/test_bug03_event_loop_and_500.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S608"]  # S608: SQL fijo de pruebas, sin entrada externa  # asserts y contraseñas de ejemplo en tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true  # app/api y app/api/v1 no tienen __init__.py
# Todo el código nuevo (HU-02 en adelante) va con mypy estricto; solo queda fuera db/session.py.
files = [
    "app/main.py",
    "app/cli.py",
    "app/core",
    "app/api",
    "app/integrations/ai_client.py",
    "app/integrations/storage",
    "app/integrations/queue.py",
    "app/integrations/email",
    "app/models",
    "app/repositories",
    "app/schemas",
    "app/services",
    "app/db/uow.py",
    "app/worker",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
