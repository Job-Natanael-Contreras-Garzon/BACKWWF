# Quality gate del back (ESTANDARES §10, DoD §3). Ejecutar: ruff check . · ruff format --check . · mypy
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "app/integrations/ia_contract",  # copia sin editar de la IA (SOURCE.md)
    "migrations",
    "tareas-job",
    "scratch",
    "Analisis_Backend_3.0_WWF_2026-11-15",
    # DEUDA (ratchet): código legado que no cumple el estándar. Cada HU que reescribe un
    # archivo lo saca de esta lista; nunca se agregan archivos nuevos aquí.
    "Found 741 errors.",
    "[*] 464 fixable with `--fix` (49 unsafe fixes available with `--fix --unsafe-fixes`).",
    "app/api/deps.py",
    "app/api/v1/auth.py",
    "app/api/v1/camera_stations.py",
    "app/api/v1/projects.py",
    "app/core/enums.py",
    "app/core/security.py",
    "app/crud/__init__.py",
    "app/crud/base.py",
    "app/crud/crud_camera_station.py",
    "app/crud/crud_project.py",
    "app/crud/crud_species.py",
    "app/db/session.py",
    "app/interfaces/__init__.py",
    "app/interfaces/auth_service.py",
    "app/interfaces/media_service.py",
    "app/interfaces/project_service.py",
    "app/interfaces/station_service.py",
    "app/interfaces/user_service.py",
    "app/models/__init__.py",
    "app/models/anon_session.py",
    "app/models/base.py",
    "app/models/camera_station.py",
    "app/models/individual.py",
    "app/models/media_file.py",
    "app/models/project.py",
    "app/models/project_station.py",
    "app/models/report.py",
    "app/models/species.py",
    "app/models/user.py",
    "app/models/video.py",
    "app/schemas/__init__.py",
    "app/schemas/auth.py",
    "app/schemas/camera_station.py",
    "app/schemas/individual.py",
    "app/schemas/media_file.py",
    "app/schemas/project.py",
    "app/schemas/project_station.py",
    "app/schemas/report.py",
    "app/schemas/species.py",
    "app/schemas/user.py",
    "app/schemas/video.py",
    "app/services/ai_service.py",
    "app/services/auth_service.py",
    "app/services/indicators_service.py",
    "app/services/media_service.py",
    "app/services/project_service.py",
    "app/services/species_data_service.py",
    "app/services/station_service.py",
    "app/services/user_service.py",
    "app/services/video_service.py",
    "check_db.py",
    "seed_db.py",
    "seed_massive.py",
    "tests/test_bug01_secrets_purge.py",
    "tests/test_bug01_settings_security.py",
    "tests/test_bug03_event_loop_and_500.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts y contraseñas de ejemplo en tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true  # app/api y app/api/v1 no tienen __init__.py
# Módulos ya alineados al estándar; core/ y services/ entran a medida que se reescriben.
files = [
    "app/main.py",
    "app/core/config.py",
    "app/core/errors.py",
    "app/core/logging.py",
    "app/core/middleware.py",
    "app/core/responses.py",
    "app/api/v1/router.py",
    "app/integrations/ai_client.py",
    "app/integrations/storage",
]
